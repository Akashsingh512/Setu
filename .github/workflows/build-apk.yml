name: Build Android APK (Setu CRM)

# Builds the Setu Android app (a Capacitor shell that loads the live web app) and
# publishes it as a GitHub Release, tag v1.0.<run number>. Installed apps check the
# latest Release and offer the update (apps/mobile/android/.../UpdateChecker.java).
#
# Every published APK is signed with the SAME key (repo secrets, see
# docs/ANDROID_APK.md): Android only installs an update over the old app when the
# keys match. Without the secrets, a debug APK is built for testing but nothing is
# published.

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Live app URL the WebView will load"
        required: false
        default: "https://3-108-61-69.sslip.io"
      required_update:
        description: "Make this update required (installed apps can't postpone it)"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/build-apk.yml"

# Cancel in-progress runs for the same branch
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Setu Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # Single source of truth for the hosted URL; overridable via the manual input.
      SETU_SERVER_URL: ${{ inputs.server_url || 'https://3-108-61-69.sslip.io' }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      # Capacitor 7 + AGP 8.7 require JDK 21. ubuntu-latest already ships the Android SDK.
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install npm dependencies (mobile workspace only)
        run: npm ci --workspace @crm/mobile --include-workspace-root --ignore-scripts

      # The Android project is committed (it holds native code); sync writes the
      # config (server URL) and plugins into it.
      - name: Sync Capacitor
        working-directory: apps/mobile
        run: npx cap sync android

      - name: Set versionCode & versionName
        run: |
          BUILD_GRADLE="apps/mobile/android/app/build.gradle"
          sed -i "s/versionCode 1$/versionCode ${VERSION_CODE}/" "$BUILD_GRADLE"
          sed -i "s/versionName \"1.0\"$/versionName \"${VERSION_NAME}\"/" "$BUILD_GRADLE"
          grep -E "versionCode|versionName" "$BUILD_GRADLE"
          grep -q "versionCode ${VERSION_CODE}" "$BUILD_GRADLE" || { echo "::error::versionCode was not set"; exit 1; }

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate Android launcher icons
        run: bash apps/mobile/scripts/generate-icons.sh

      - name: Check signing secrets
        id: signing
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$HAS_KEYSTORE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets: building a debug APK for testing only. Nothing will be published (see docs/ANDROID_APK.md)."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$KEYSTORE" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          rm -f "$KEYSTORE"

      - name: Build debug APK (testing only)
        if: steps.signing.outputs.available != 'true'
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p build-output
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "build-output/Setu-${VERSION_NAME}.apk"
          else
            cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk "build-output/Setu-${VERSION_NAME}-debug.apk"
          fi
          ls -lh build-output/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Setu-Android-APK-${{ github.run_number }}
          path: build-output/Setu-*.apk

      # Only signed builds are published: installed apps update to the latest Release.
      - name: Create GitHub Release
        if: steps.signing.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: "Setu v${{ env.VERSION_NAME }}"
          body: |
            ${{ inputs.required_update && 'required: true' || '' }}
            Setu for Android, version ${{ env.VERSION_NAME }}.

            New install: download Setu-${{ env.VERSION_NAME }}.apk below, open it, and allow installing from your browser if asked.
            Already installed: open Setu and tap Update when it asks.
          files: build-output/Setu-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
