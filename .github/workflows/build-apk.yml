name: Build Android APK (Setu CRM)

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Live app URL the WebView will load"
        required: false
        default: "https://3-108-61-69.sslip.io"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/build-apk.yml"

# Cancel in-progress runs for the same branch
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Setu Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # Single source of truth for the hosted URL.
      # Overridable via workflow_dispatch input.
      SETU_SERVER_URL: ${{ inputs.server_url || 'https://3-108-61-69.sslip.io' }}

    steps:
      # ── Checkout ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Toolchain ──────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # Capacitor 7 + AGP 8.7 require JDK 21
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # ubuntu-latest already ships ANDROID_HOME – no extra SDK setup needed.

      # ── Dependencies ───────────────────────────────────────
      - name: Install npm dependencies (mobile workspace only)
        run: npm ci --workspace @crm/mobile --include-workspace-root --ignore-scripts

      # ── Capacitor ──────────────────────────────────────────
      - name: Add Capacitor Android platform
        working-directory: apps/mobile
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: apps/mobile
        run: npx cap sync android

      # ── Version codes ──────────────────────────────────────
      - name: Patch versionCode & versionName
        run: |
          BUILD_GRADLE="apps/mobile/android/app/build.gradle"
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" "$BUILD_GRADLE"
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" "$BUILD_GRADLE"
          echo "versionCode=${{ github.run_number }}, versionName=1.0.${{ github.run_number }}"

      # ── Launcher icons ─────────────────────────────────────
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate Android launcher icons
        run: bash apps/mobile/scripts/generate-icons.sh

      # ── Build debug APK ────────────────────────────────────
      - name: Build debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Check signing secrets
        id: signing
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$HAS_KEYSTORE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Decode keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/mobile/android/app/release.keystore

          # Build release APK
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

          # Clean up keystore
          rm -f app/release.keystore

      # ── Prepare artifacts ──────────────────────────────────
      - name: Rename & collect APKs
        run: |
          mkdir -p build-output
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk \
             "build-output/Setu-1.0.${{ github.run_number }}.apk"

          # If signed release APK was built, include it too
          RELEASE_APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "build-output/Setu-1.0.${{ github.run_number }}-release.apk"
          fi

          ls -lh build-output/

      # ── Upload workflow artifact ───────────────────────────
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Setu-Android-APK-${{ github.run_number }}
          path: build-output/Setu-*.apk

      # ── GitHub Release ─────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Setu CRM v1.0.${{ github.run_number }}"
          body: |
            ## Setu CRM – Android APK v1.0.${{ github.run_number }}

            **Server URL:** `${{ env.SETU_SERVER_URL }}`

            ### Install
            1. Download `Setu-1.0.${{ github.run_number }}.apk` below.
            2. On your Android phone, enable *Settings → Install unknown apps* for your browser.
            3. Open the downloaded file and tap **Install**.

            > This is a debug build. For a signed release build, configure the signing secrets (see docs/ANDROID_APK.md).
          files: build-output/Setu-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
