<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setu CRM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #fff; }
    p { font-size: 0.95rem; color: #a0a0b8; margin-bottom: 1.5rem; }
    a {
      color: #7c3aed;
      text-decoration: none;
      font-weight: 500;
      padding: 0.6rem 1.2rem;
      border: 1px solid #7c3aed;
      border-radius: 8px;
      transition: background 0.2s;
    }
    a:hover, a:active { background: rgba(124,58,237,0.15); }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>Loading Setu…</h1>
  <p>Connecting to the Setu CRM server.</p>
  <a href="https://3-108-61-69.sslip.io">Open Setu CRM</a>
</body>
</html>
